apiVersion: v2
name: qubership-istio
description: A Helm chart that assembles all Istio component charts (base, cni, istiod, ztunnel)
type: application
# Placeholder, deliberately 0.0.0 so a value that escapes the build is obvious
# rather than plausible. The build stamps it with the qubership-istio release
# version, or `0.0.0-<branch>` for a dev build.
# See .github/workflows/docker-publish.yml.
version: 0.0.0
dependencies:
  - name: base
    version: "1.28.10"
    repository: "https://istio-release.storage.googleapis.com/charts"
  - name: cni
    version: "1.28.10"
    repository: "https://istio-release.storage.googleapis.com/charts"
  - name: istiod
    version: "1.28.10"
    repository: "https://istio-release.storage.googleapis.com/charts"
  - name: ztunnel
    version: "1.28.10"
    repository: "https://istio-release.storage.googleapis.com/charts"
